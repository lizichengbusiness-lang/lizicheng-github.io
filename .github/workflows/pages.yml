name: Publish ZhiXue Atlas
on:
  push:
    branches: [main]
    paths: [zhixue-atlas-source.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Unpack editable source
        run: unzip -q zhixue-atlas-source.zip -d site-source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site-source/package-lock.json
      - name: Install locked dependencies
        working-directory: site-source
        run: npm ci
      - name: Check types and behavior
        working-directory: site-source
        run: |
          npx tsc --noEmit
          npm test
      - name: Build website
        working-directory: site-source
        run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site-source/dist-pages
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
